name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0). Leave empty to only build."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libgtk-3-dev
      - name: Core tests
        run: cargo test -p wordcore
      - name: Build app
        run: cargo build -p app

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: RWord-Windows
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: RWord-Mac-AppleSilicon
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: RWord-Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test core
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test -p wordcore --target ${{ matrix.target }}
      - name: Build release
        run: cargo build -p app --release --target ${{ matrix.target }}
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=dist/RWord.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/rword "$APP/Contents/MacOS/rword"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cp crates/app/assets/icon/rword.icns "$APP/Contents/Resources/rword.icns"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" ${{ matrix.artifact }}.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rword.exe dist/RWord.exe
          cd dist && 7z a ../${{ matrix.artifact }}.zip RWord.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: RWord ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*/*.zip
          generate_release_notes: true
          make_latest: true
