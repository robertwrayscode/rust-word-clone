[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RWord desktop word processor"

[[bin]]
name = "rword"
path = "src/main.rs"

[dependencies]
wordcore = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
dirs = "6"
tiny-skia = "0.11"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
winresource = "0.1"
