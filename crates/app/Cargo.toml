[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RWord desktop word processor"

[[bin]]
name = "rword"
path = "src/main.rs"

[dependencies]
wordcore = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
